name: v0.9.4 development validation
on:
  push:
    branches: [dev/v0.9.4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q src
      - run: python -m pytest -q
      - run: python tools/build_release.py
      - run: python tools/verify_distribution.py dist/ShipArchitect_v0.9.4_preview.zip --output distribution_check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v094-preview-${{ runner.os }}
          path: |
            distribution_check.json
            dist/ShipArchitect_v0.9.4_preview.zip
