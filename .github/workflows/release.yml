name: Test and release runtime package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  windows-package:
    needs: regression
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python tools/build_release.py
      - run: python tools/verify_distribution.py dist/ShipArchitect_v0.9.3.2.zip --output distribution_check.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-v0.9.3.2
          path: dist/ShipArchitect_v0.9.3.2.zip
      - name: Create version tags and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse v0.9.3.1 >/dev/null 2>&1; then
            git tag v0.9.3.1 a41f3227db94cb224af84a093136acff68e432c7
            git push origin refs/tags/v0.9.3.1
          fi
          if ! git rev-parse v0.9.3.2 >/dev/null 2>&1; then
            git tag v0.9.3.2 "$GITHUB_SHA"
            git push origin refs/tags/v0.9.3.2
          fi
          if ! gh release view v0.9.3.2 >/dev/null 2>&1; then
            gh release create v0.9.3.2 dist/ShipArchitect_v0.9.3.2.zip --title 'Ship Architect v0.9.3.2' --notes-file CHANGELOG.md
          fi
